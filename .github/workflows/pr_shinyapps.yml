name: pr_shinyapps
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  deploy-shinyapps:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/api2r/pkgskills-ci:release
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: api2r/actions/install@v1
        with:
          use-container: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          extra-packages: any::rsconnect, any::cpp11
      - name: Push to shinyapps
        run: |
          rsconnect::setAccountInfo(name='r4dscommunity', token=${{secrets.SHINYAPPS_TOKEN}}, secret=${{secrets.SHINYAPPS_SECRET}})
          rsconnect::deployApp(appName = 'cookiestest', forceUpdate = TRUE)
        shell: Rscript {0}
